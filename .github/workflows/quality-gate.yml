name: Quizzy quality gate

on:
  push:
  pull_request:

jobs:
  build-and-logic-tests:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.401
      - run: dotnet restore QuizMvp.sln --locked-mode
      - run: dotnet build QuizMvp.sln --no-restore --configuration Release
      - run: dotnet test QuizMvp.sln --no-build --configuration Release
      - run: dotnet run --project QuizMvp.LogicTests/QuizMvp.LogicTests.csproj --no-build --configuration Release
